# Preview de Vercel para PRs y ramas (el deploy de master lo gestiona la
# integración de Vercel con GitHub, este workflow solo cubre previews).
#
# Requiere 1 secreto en el repo: VERCEL_TOKEN
#   Vercel → Settings → Tokens → crear token (scope: el team) y añadirlo como
#   secreto de acciones. ORG_ID/PROJECT_ID no son secretos (vienen de
#   .vercel/repo.json y van fijados abajo).
#
# El build corre en la nube de Vercel con las env vars del entorno "preview"
# del proyecto (incluido DATABASE_URL y el script vercel-build con las
# migraciones), igual que en los deploys de master.

name: Vercel Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore:
      - master

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_5sqbl9v3aok5SwZvpvcz8m8L
  VERCEL_PROJECT_ID: prj_1AaOgEFthx4ridhi515JhFhOgLjZ

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy preview (build en la nube de Vercel)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(npx --yes vercel@latest deploy \
            --yes \
            --token "$VERCEL_TOKEN" \
            --meta "githubCommitSha=${{ github.sha }}" \
            --meta "githubCommitRef=${{ github.ref_name }}" \
            | tail -n 1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $URL"

      - name: Comentario en el PR con la URL de preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- vercel-preview -->";
            const url = "${{ steps.deploy.outputs.url }}";
            if (!url.startsWith("https://")) { core.notice("Sin URL de preview"); return; }
            const body = marker + "\n🧶 **Preview de Vercel lista:** " + url;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
